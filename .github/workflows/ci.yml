name: CI and prebuilt distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and installer
    runs-on: ubuntu-22.04
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:action
      - run: npm run check:action
      - run: npm run check:docs
      - name: Prepare Rust toolchain
        run:
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --bins --locked
      - run: cargo dev lint --no-config --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    if: >-
      github.repository == 'RhNu/Rusteward' && github.ref == 'refs/heads/main' && (github.event_name
      == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Prepare native Rust target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run:
          cargo build --release --package rusteward --bin cargo-dev --locked --target ${{
          matrix.target }}
      - name: Package binary and checksums
        run: node action/src/package.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish complete prebuilt release
    needs: build
    runs-on: ubuntu-22.04
    concurrency:
      group: rusteward-prebuilt-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuilt-*
          path: artifacts
          merge-multiple: true
      - name: Publish exact-commit packages
        run: node action/src/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
