[workspace]
members = ["crates/core", "crates/workspace", "apps/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
anyhow = "1"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "6"
globset = "0.4"
pathdiff = "0.2"
ra_ap_syntax = "=0.0.356"
rayon = "1.12"
rustc_lexer = { package = "ra-ap-rustc_lexer", version = "0.175.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
toml = "1.1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Keep the parser and lexer on compatible Unicode 17 tables.
unicode-ident = "=1.0.22"
walkdir = "2"
rusteward-core = { path = "crates/core" }
rusteward-workspace = { path = "crates/workspace" }

[workspace.lints.rust]
unsafe_code = "forbid"
