name: Install Rusteward
description: Install and cache a prebuilt Rusteward binary for the selected repository revision
branding:
  icon: download
  color: orange
inputs:
  ref:
    description: Rusteward branch, tag, or full commit SHA to install
    required: false
    default: main
  token:
    description: GitHub token used to resolve commits and release metadata
    required: false
    default: ${{ github.token }}
  cache:
    description: Restore and save the installed binary in GitHub Actions cache
    required: false
    default: "true"
  wait-timeout:
    description: Seconds to wait for the selected commit's prebuilt release (0 to 900)
    required: false
    default: "180"
outputs:
  sha:
    description: Full commit SHA installed
  target:
    description: Rust target triple of the installed binary
  cache-hit:
    description: Whether a validated installation was reused from either cache
  path:
    description: Directory containing cargo-dev, added to PATH
runs:
  using: node24
  main: action/dist/index.cjs
